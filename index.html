<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caster Tracker">
<title>Caster Tracker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, sans-serif; background: #f2f2f7; color: #1c1c1e; }
  header { background: #fff; padding: 16px 20px 12px; border-bottom: 1px solid #e5e5ea; position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0 0 12px; font-size: 22px; font-weight: 700; }
  .stats { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat { flex: 1; background: #f2f2f7; border-radius: 10px; padding: 8px 10px; text-align: center; }
  .stat-num { font-size: 20px; font-weight: 700; color: #1c1c1e; }
  .stat-label { font-size: 11px; color: #8e8e93; margin-top: 1px; }
  .progress-bar { height: 4px; background: #e5e5ea; border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
  .progress-fill { height: 100%; background: #34c759; border-radius: 2px; transition: width 0.3s; }
  input[type=text], input[type=email] { width: 100%; padding: 10px 14px; border-radius: 10px; border: none; background: #f2f2f7; font-size: 16px; outline: none; }
  .city-filters { display: flex; gap: 6px; overflow-x: auto; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e5e5ea; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .city-filters::-webkit-scrollbar { display: none; }
  .tag { padding: 5px 12px; border-radius: 99px; border: 1px solid #c7c7cc; font-size: 13px; color: #3a3a3c; background: #fff; white-space: nowrap; cursor: pointer; }
  .tag.active { background: #1c1c1e; color: #fff; border-color: #1c1c1e; }
  .list { padding: 0 0 40px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: #fff; border-bottom: 1px solid #f2f2f7; min-height: 60px; }
  .row.done .name { color: #8e8e93; text-decoration: line-through; }
  .cb { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c7c7cc; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; cursor: pointer; }
  .row.done .cb { background: #34c759; border-color: #34c759; }
  .info { flex: 1; min-width: 0; cursor: pointer; }
  .name { font-size: 15px; font-weight: 600; color: #1c1c1e; }
  .sub { font-size: 13px; color: #8e8e93; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-btn { font-size: 13px; color: #007aff; text-decoration: none; padding: 6px 10px; border-radius: 8px; background: #f0f8ff; white-space: nowrap; flex-shrink: 0; }
  .del-btn { font-size: 18px; color: #ff3b30; padding: 6px 8px; cursor: pointer; flex-shrink: 0; }
  .section-header { padding: 8px 20px; font-size: 12px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.05em; background: #f2f2f7; }
  .empty { text-align: center; padding: 60px 20px; color: #8e8e93; font-size: 15px; }

  /* Add form */
  .add-btn-float { position: fixed; bottom: 28px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: #007aff; color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(0,122,255,0.4); cursor: pointer; z-index: 20; border: none; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 30; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px 40px; width: 100%; }
  .modal h2 { margin: 0 0 20px; font-size: 18px; font-weight: 700; }
  .field { margin-bottom: 12px; }
  .field label { font-size: 12px; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 4px; padding-left: 4px; }
  .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
  .btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: #007aff; color: #fff; }
  .btn-cancel { background: #f2f2f7; color: #1c1c1e; }
  .reset-btn { display: block; margin: 20px auto 60px; padding: 12px 24px; background: #fff; border: 1px solid #ff3b30; color: #ff3b30; border-radius: 10px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>🎬 Caster Tracker</h1>
  <div class="stats" id="stats"></div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <input type="text" id="search" placeholder="Suche nach Name, Firma, Stadt…" oninput="render()">
</header>

<div class="city-filters" id="city-filters"></div>
<div class="list" id="list"></div>
<button class="reset-btn" onclick="resetAll()">Alle zurücksetzen</button>

<!-- Floating Add Button -->
<button class="add-btn-float" onclick="openModal()">+</button>

<!-- Add Caster Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <h2>Neuen Caster hinzufügen</h2>
    <div class="field">
      <label>Name *</label>
      <input type="text" id="f-name" placeholder="z.B. Maria Müller">
    </div>
    <div class="field">
      <label>E-Mail *</label>
      <input type="email" id="f-email" placeholder="z.B. mail@casting.de">
    </div>
    <div class="field">
      <label>Firma</label>
      <input type="text" id="f-firma" placeholder="z.B. Müller Casting">
    </div>
    <div class="field">
      <label>Stadt</label>
      <input type="text" id="f-stadt" placeholder="z.B. München">
    </div>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="addCaster()">Hinzufügen</button>
    </div>
  </div>
</div>

<script>

,"name":"Sabine Schwedhelm","email":"sabine@filmcastinfo.de","stadt":"Köln"},{"firma":"","name":"Katharina Krischker","email":"katharina@juno-casting.de","stadt":"Leipzig"},{"firma":"","name":"Cornelia Mareth","email":"mareth@cmr-casting.de","stadt":"Leipzig"},{"firma":"","name":"Ines Rahn","email":"ines.rahn@saxonia-media.de","stadt":"Leipzig"},{"firma":"","name":"Maria Rölcke","email":"roelcke@cmr-casting.de","stadt":"Leipzig"},{"firma":"","name":"Michael Ludwig","email":"ludwig.mi@zdf.de","stadt":"Mainz"},{"firma":"Aigner Casting","name":"Franziska Aigner","email":"mail@franziska-aigner-casting.de","stadt":"München"},{"firma":"","name":"Lore Blössl","email":"lb@tv60film.de","stadt":"München"},{"firma":"Braker Casting","name":"An Dorthe Braker","email":"andorthe@braker.de","stadt":"München"},{"firma":"","name":"Cornelia von Braun","email":"cornelia@von-braun.de","stadt":"München"},{"firma":"Agentur Isarperlen","name":"Petra Geidobler","email":"info@agentur-isarperlen.de","stadt":"München"},{"firma":"","name":"Anne Hünseler","email":"anne.hue@gmx.de","stadt":"München"},{"firma":"Die Annas Casting","name":"Anna Kulzinger","email":"casting@dieannas.com","stadt":"München"},{"firma":"","name":"Nessie Nesslauer","email":"mail@nesslauer-casting.de","stadt":"München"},{"firma":"Pohlmann Casting","name":"Stefany Pohlmann","email":"orga@pohlmann-casting.de","stadt":"München"},{"firma":"Die Annas Casting","name":"Anna Isabelle Schmidt","email":"casting@dieannas.com","stadt":"München"},{"firma":"Dreamteam Munich","name":"Stephen Sikder","email":"Stephen.Sikder@dreamteammunich.de","stadt":"München"},{"firma":"Tolkien Casting","name":"Daniela Tolkien","email":"info@tolkien-casting.de","stadt":"München"},{"firma":"Bavaria Fiction Besetzungsbüro","name":"Siegfried Wagner","email":"Siegfried.wagner@bavaria-film.de","stadt":"München"},{"firma":"Bavaria Fiction Besetzungsbüro","name":"Till Zink","email":"Till.Zink@Bavaria-Fiction.de","stadt":"München"},{"firma":"Supremecast","name":"Bärbel Bodeux","email":"contact@supremecast.de","stadt":"Münster"},{"firma":"Ufa Casting","name":"Laura Buschhagen","email":"Laura.Buschhagen@ufa.de","stadt":"Potsdam"},{"firma":"Ufa Casting","name":"Ingrid Cuenca","email":"ingrid.cuenca@ufa.de","stadt":"Potsdam"},{"firma":"","name":"Andreas Diego","email":"Diego.Andreas@ufa.de","stadt":"Potsdam"},{"firma":"","name":"Nina Haun","email":"nina.haun@ufa.de","stadt":"Potsdam"},{"firma":"","name":"Manolya Mutlu","email":"info@mm-casting.de","stadt":"Stuttgart"},{"firma":"","name":"Lorenzo Vitti","email":"lorenzo@cassandrahan.com","stadt":"Südtirol"},{"firma":"Cassandra Han Casting","name":"Cassandra Han","email":"cassandra@cassandrahan.com","stadt":"USA"},{"firma":"","name":"Anne Kathrin Heubner","email":"office@heubner-casting.de","stadt":"Weimar"},{"firma":"","name":"Lucky Englander","email":"lucky.englander@chello.at","stadt":"Wien"},{"firma":"","name":"Fritz Fleischhacker","email":"ff-casting@aon.at","stadt":"Wien"},{"firma":"","name":"Judith Limberger","email":"judith@limbergercasting.com","stadt":"Wien"},{"firma":"","name":"Lisa Oláh","email":"lisa@olah.at","stadt":"Wien"},{"firma":"","name":"Eva Roth","email":"evarothcasting@gmail.com","stadt":"Wien"},{"firma":"","name":"Rita Waszilovics","email":"westendcasting@chello.at","stadt":"Wien"},{"firma":"","name":"Corinna Glaus","email":"info@glauscasting.ch","stadt":"Zürich"},{"firma":"","name":"Ruth Hirschfeld","email":"rh@swisscasting.ch","stadt":"Zürich"},{"firma":"","name":"Anna Katharina Kugel","email":"info@die-casterei.de","stadt":""},{"firma":"Peti Misaila Casting","name":"Peti Misaila","email":"casting@petimisaila.com","stadt":""}];

let done = {};
let custom = [];
let cityFilter = 'Alle';

function allCasters() { return [...BASE_CASTERS, ...custom]; }

function load() {
  try { done = JSON.parse(localStorage.getItem('caster-done') || '{}'); } catch(e) { done = {}; }
  try { custom = JSON.parse(localStorage.getItem('caster-custom') || '[]'); } catch(e) { custom = []; }
  buildCityFilters();
  render();
}

function save() {
  try {
    localStorage.setItem('caster-done', JSON.stringify(done));
    localStorage.setItem('caster-custom', JSON.stringify(custom));
  } catch(e) {}
}

function buildCityFilters() {
  const cities = ['Alle', ...new Set(allCasters().map(c => c.stadt||'—').filter(Boolean))].sort((a,b) => a==='Alle'?-1:b==='Alle'?1:a.localeCompare(b));
  document.getElementById('city-filters').innerHTML = cities.map(c =>
    `<span class="tag${c===cityFilter?' active':''}" onclick="setCity('${c}')">${c}</span>`
  ).join('');
}

function setCity(c) { cityFilter = c; buildCityFilters(); render(); }

function toggle(email) { done[email] = !done[email]; save(); render(); }

function deleteCaster(email) {
  if (!confirm('Diesen Caster löschen?')) return;
  custom = custom.filter(c => c.email !== email);
  delete done[email];
  save(); buildCityFilters(); render();
}

function resetAll() {
  if (!confirm('Wirklich alle zurücksetzen?')) return;
  done = {}; save(); render();
}

function openModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('f-name').focus();
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
    ['f-name','f-email','f-firma','f-stadt'].forEach(id => document.getElementById(id).value = '');
  }
}

function addCaster() {
  const name = document.getElementById('f-name').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const firma = document.getElementById('f-firma').value.trim();
  const stadt = document.getElementById('f-stadt').value.trim();
  if (!name || !email) { alert('Name und E-Mail sind Pflichtfelder.'); return; }
  if (allCasters().find(c => c.email === email)) { alert('Diese E-Mail existiert bereits.'); return; }
  custom.push({ name, email, firma, stadt });
  save(); buildCityFilters();
  closeModal();
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const all = allCasters();
  const filtered = all.filter(c => {
    const matchCity = cityFilter === 'Alle' || (c.stadt||'—') === cityFilter;
    const matchQ = !q || c.name.toLowerCase().includes(q) || (c.firma||'').toLowerCase().includes(q) || (c.stadt||'').toLowerCase().includes(q);
    return matchCity && matchQ;
  });

  const total = all.length;
  const doneCount = Object.values(done).filter(Boolean).length;
  const pct = Math.round(doneCount/total*100);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-num">${doneCount}</div><div class="stat-label">Gesendet</div></div>
    <div class="stat"><div class="stat-num">${total - doneCount}</div><div class="stat-label">Ausstehend</div></div>
    <div class="stat"><div class="stat-num">${pct}%</div><div class="stat-label">Fortschritt</div></div>
  `;
  document.getElementById('progress').style.width = pct + '%';

  const pending = filtered.filter(c => !done[c.email]);
  const finished = filtered.filter(c => done[c.email]);

  let html = '';
  if (pending.length) {
    html += `<div class="section-header">Ausstehend (${pending.length})</div>`;
    html += pending.map(c => rowHTML(c)).join('');
  }
  if (finished.length) {
    html += `<div class="section-header">Gesendet (${finished.length})</div>`;
    html += finished.map(c => rowHTML(c)).join('');
  }
  if (!filtered.length) html = `<div class="empty">Keine Ergebnisse</div>`;

  document.getElementById('list').innerHTML = html;
}

function rowHTML(c) {
  const isDone = done[c.email];
  const isCustom = custom.find(x => x.email === c.email);
  return `<div class="row${isDone?' done':''}">
    <div class="cb" onclick="toggle('${c.email}')">
      ${isDone ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}
    </div>
    <div class="info" onclick="toggle('${c.email}')">
      <div class="name">${c.name}${isCustom ? ' <span style="font-size:10px;color:#007aff;font-weight:400;">neu</span>' : ''}</div>
      <div class="sub">${[c.firma, c.stadt].filter(Boolean).join(' · ')}</div>
    </div>
    <a class="mail-btn" href="mailto:${c.email}">Mail</a>
    ${isCustom ? `<span class="del-btn" onclick="deleteCaster('${c.email}')">×</span>` : ''}
  </div>`;
}

load();
</script>

</html>
